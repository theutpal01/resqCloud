services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: resqcloud
      POSTGRES_USER: resq
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq -d resqcloud"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
