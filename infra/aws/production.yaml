AWSTemplateFormatVersion: '2010-09-09'
Description: ResQCloud single-instance production pilot in ap-southeast-2.
Parameters:
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random header value used to reject requests that bypass CloudFront.
  ImageTag:
    Type: String
    Default: release
  CognitoUserPoolId:
    Type: String
    Default: ap-southeast-2_WZcaBvFq9
  CognitoDomain:
    Type: String
    Default: https://ap-southeast-2wzcabvfq9.auth.ap-southeast-2.amazoncognito.com
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: resqcloud-production}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.16.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.128.0/20
      AvailabilityZone: !Select [0, !GetAZs '']
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.144.0/20
      AvailabilityZone: !Select [1, !GetAZs '']
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for ResQCloud production Aurora.
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront origin traffic to the application load balancer.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application tasks accept traffic only from the load balancer.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accepts application task connections only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt ApplicationSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
  Database:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: resqcloud-production
      Engine: aurora-postgresql
      EngineVersion: '17.9'
      DatabaseName: resqcloud
      MasterUsername: resqadmin
      ManageMasterUserPassword: true
      EnableIAMDatabaseAuthentication: true
      StorageEncrypted: true
      KmsKeyId: alias/aws/rds
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '17:00-17:30'
      PreferredMaintenanceWindow: 'sun:18:00-sun:18:30'
      CopyTagsToSnapshot: true
      DeletionProtection: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds: [!GetAtt DatabaseSecurityGroup.GroupId]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2
      EnableCloudwatchLogsExports: [postgresql]
  DatabaseWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref Database
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [POST, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3600
  EventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: resqcloud-production-events-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: resqcloud-production-events
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDeadLetterQueue.Arn
        maxReceiveCount: 5
  CriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: resqcloud-production-critical-alerts
      KmsMasterKeyId: alias/aws/sns
  ProductionCognitoClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPoolId
      ClientName: resqcloud-production-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub 'https://${CloudFrontDistribution.DomainName}/auth/callback'
      LogoutURLs:
        - !Sub 'https://${CloudFrontDistribution.DomainName}/'
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: minutes
        IdToken: minutes
  ApplicationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: resqcloud/production/jwt-secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: resqcloud-production-api
      ImageScanningConfiguration: {ScanOnPush: true}
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep latest ten images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: resqcloud-production-web
      ImageScanningConfiguration: {ScanOnPush: true}
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep latest ten images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: resqcloud-production
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /resqcloud/production/api
      RetentionInDays: 30
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /resqcloud/production/web
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadProductionTaskSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ApplicationSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApplicationRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${Database.DBClusterResourceId}/resq_app
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub ${EvidenceBucket.Arn}/*
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt EventsQueue.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref CriticalAlertsTopic
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 4000
      HealthCheckPath: /ready
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200-399'}
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!GetAtt LoadBalancerSecurityGroup.GroupId]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: CloudFront origin authentication required.
  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig: {HttpHeaderName: X-ResQCloud-Origin, Values: [!Ref OriginSecret]}
        - Field: path-pattern
          PathPatternConfig: {Values: ['/api/*', '/health', '/ready', '/socket.io/*']}
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup
  WebListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: http-header
          HttpHeaderConfig: {HttpHeaderName: X-ResQCloud-Origin, Values: [!Ref OriginSecret]}
        - Field: path-pattern
          PathPatternConfig: {Values: ['/*']}
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: resqcloud-production-api
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: api
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/resqcloud-production-api:${ImageTag}
          Essential: true
          PortMappings: [{ContainerPort: 4000, Protocol: tcp}]
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: PORT, Value: '4000'}
            - {Name: APP_ORIGIN, Value: !Sub 'https://${CloudFrontDistribution.DomainName}'}
            - {Name: DB_DIALECT, Value: postgres}
            - {Name: DATABASE_URL, Value: !Sub 'postgres://resq_app@${Database.Endpoint.Address}:5432/resqcloud'}
            - {Name: DB_SSL, Value: 'true'}
            - {Name: DB_IAM_AUTH, Value: 'true'}
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: S3_BUCKET, Value: !Ref EvidenceBucket}
            - {Name: SQS_QUEUE_URL, Value: !Ref EventsQueue}
            - {Name: SNS_TOPIC_ARN, Value: !Ref CriticalAlertsTopic}
            - {Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId}
            - {Name: COGNITO_CLIENT_ID, Value: !Ref ProductionCognitoClient}
          Secrets:
            - {Name: JWT_SECRET, ValueFrom: !Ref ApplicationSecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "fetch(\"http://127.0.0.1:4000/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: resqcloud-production-migrate
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/resqcloud-production-api:${ImageTag}
          Essential: true
          Command: [node, apps/api/dist/apps/api/src/bootstrapProduction.js]
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: APP_ORIGIN, Value: !Sub 'https://${CloudFrontDistribution.DomainName}'}
            - {Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId}
            - {Name: COGNITO_CLIENT_ID, Value: !Ref ProductionCognitoClient}
            - {Name: DB_SSL_CA_PATH, Value: /etc/ssl/certs/rds-global-bundle.pem}
            - {Name: ADMIN_DB_USERNAME, Value: resqadmin}
            - {Name: ADMIN_DB_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: ADMIN_DB_PORT, Value: '5432'}
            - {Name: ADMIN_DB_NAME, Value: resqcloud}
          Secrets:
            - {Name: ADMIN_DB_SECRET, ValueFrom: !GetAtt Database.MasterUserSecret.SecretArn}
            - {Name: JWT_SECRET, ValueFrom: !Ref ApplicationSecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrate
  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: resqcloud-production-web
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: web
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/resqcloud-production-web:${ImageTag}
          Essential: true
          PortMappings: [{ContainerPort: 3000, Protocol: tcp}]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Properties:
      ServiceName: resqcloud-production-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!GetAtt ApplicationSecurityGroup.GroupId]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 4000
          TargetGroupArn: !Ref ApiTargetGroup
  WebService:
    Type: AWS::ECS::Service
    DependsOn: WebListenerRule
    Properties:
      ServiceName: resqcloud-production-web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!GetAtt ApplicationSecurityGroup.GroupId]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref WebTargetGroup
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: resqcloud-production-no-cache
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: {HeaderBehavior: none}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: resqcloud-production-api-origin
        HeadersConfig: {HeaderBehavior: allViewer}
        CookiesConfig: {CookieBehavior: all}
        QueryStringsConfig: {QueryStringBehavior: all}
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ResQCloud production pilot
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: application-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-ResQCloud-Origin
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: application-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: !Ref ApiCachePolicy
          OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: application-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            Compress: true
          - PathPattern: /socket.io/*
            TargetOriginId: application-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            Compress: true
          - PathPattern: /health
            TargetOriginId: application-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /ready
            TargetOriginId: application-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        Restrictions:
          GeoRestriction: {RestrictionType: none}
  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt EvidenceBucket.Arn, !Sub '${EvidenceBucket.Arn}/*']
            Condition:
              Bool: {aws:SecureTransport: false}
Outputs:
  ApplicationUrl:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  ClusterName:
    Value: !Ref Cluster
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri
  MigrationTaskDefinition:
    Value: !Ref MigrationTaskDefinition
  ApiServiceName:
    Value: !Ref ApiService
  WebServiceName:
    Value: !Ref WebService
  PublicSubnets:
    Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  ApplicationSecurityGroup:
    Value: !GetAtt ApplicationSecurityGroup.GroupId
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  DatabaseClusterIdentifier:
    Value: !Ref Database
  DatabaseWriterIdentifier:
    Value: !Ref DatabaseWriter
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  CognitoUserPoolId:
    Value: !Ref CognitoUserPoolId
  CognitoClientId:
    Value: !Ref ProductionCognitoClient
  CognitoDomain:
    Value: !Ref CognitoDomain
